---
# Dummy values for offline flate builds (CI and local `task validate`).
# Mirrors kubernetes/flux/vars/cluster-secrets.sops.yaml so that Flux
# postBuild substitutions resolve to strings instead of null when the
# SOPS-encrypted source cannot be decrypted. Never put real values here.
apiVersion: v1
kind: Secret
metadata:
  name: cluster-secrets
  namespace: flux-system
stringData:
  PUBLIC_DOMAIN: example.com
  SECRET_DOMAIN: example.com
  SECRET_CLOUDFLARE_EMAIL: user@example.com
  SECRET_CLOUDFLARE_TUNNEL_ID: dummy-tunnel-id
  SONARR_API_KEY: dummy-sonarr-api-key
  RADARR_API_KEY: dummy-radarr-api-key
  PAGERDUTY_KEY: dummy-pagerduty-key
  PAGERDUTY_URL: https://dummy.pagerduty.example.com
  HEALTHCHECKS_IO_URL: https://dummy.healthchecks.example.com
  LOCAL_SUBNETS: 192.168.0.0/16
  SECRET_REDIS_PASSWORD: dummy-redis-password
  JELLYFIN_EXPORTER_API_KEY: dummy-jellyfin-api-key
