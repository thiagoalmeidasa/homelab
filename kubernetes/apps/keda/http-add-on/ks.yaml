---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-apps-keda-http-add-on
  namespace: flux-system
spec:
  dependsOn:
    - name: cluster-apps-keda
  path: ./kubernetes/apps/keda/http-add-on/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 5m
