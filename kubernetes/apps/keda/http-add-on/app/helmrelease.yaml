---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keda-add-ons-http
  namespace: keda
spec:
  interval: 15m
  chart:
    spec:
      chart: keda-add-ons-http
      version: 0.16.0
      sourceRef:
        kind: HelmRepository
        name: kedacore
        namespace: flux-system
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    interceptor:
      replicas:
        min: 2
        max: 2
