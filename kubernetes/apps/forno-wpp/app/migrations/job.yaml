---
apiVersion: batch/v1
kind: Job
metadata:
  name: forno-wpp-migrate
  namespace: forno-wpp
spec:
  completions: 1
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      imagePullSecrets:
        - name: forno-wpp-registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: git.home399.thiagoalmeida.xyz/casa-de-farinha/forno-wpp-migrate:sha-8a461129c951d576d5a449770e82114ac89c5fce@sha256:0ea5d407ff8f7a603d6e7b8fdec650c5b5e3d5d34772eb54a17c2ac54f585cfd
          args: ["up"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: forno-app
                  key: DATABASE_URL
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
