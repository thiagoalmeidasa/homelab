---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app forno-wpp
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback

  values:
    controllers:
      forno-wpp:
        type: deployment
        replicas: 1
        pod:
          imagePullSecrets:
            - name: forno-wpp-registry
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
        containers:
          app:
            image:
              repository: git.home399.thiagoalmeida.xyz/casa-de-farinha/forno-wpp
              tag: sha-8a461129c951d576d5a449770e82114ac89c5fce@sha256:a0303de7dc50b6913d0ec7b2a5b0c89239ef20f099fb1a260a007ebeba96f125
            env:
              HTTP_ADDR: ":8080"
              AUDIO_DIR: /app/audio
              WEB_DIR: /app/web
              PUBLIC_ORIGIN: https://forno-wpp.${SECRET_DOMAIN}
              COLLECTION_POLL_INTERVAL: 30m
              COLLECTION_POLL_LIMIT: "50"
              FOLLOWER_POLL_INTERVAL: 1h
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: forno-app
                    key: DATABASE_URL
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &port 8080
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /readyz
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *port
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 60
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL

    service:
      app:
        controller: *app
        type: ClusterIP
        ports:
          http:
            port: *port

    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: Forno
          gethomepage.dev/group: Messaging
          gethomepage.dev/icon: whatsapp.png
        parentRefs:
          - name: internal
            namespace: networking
            sectionName: https
        hostnames: ["forno-wpp.${SECRET_DOMAIN}"]
        rules:
          - backendRefs:
              - identifier: app
                port: http

    persistence:
      audio:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        retain: true
        size: 2Gi
        storageClass: longhorn
        labels:
          recurring-job-group.longhorn.io/backup: enabled
          recurring-job.longhorn.io/source: enabled
        globalMounts:
          - path: /app/audio
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
