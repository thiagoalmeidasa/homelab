---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forno-wpp-oauth2-proxy
  namespace: forno-wpp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: forno-wpp-oauth2-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forno-wpp-oauth2-proxy
      annotations:
        setGateway: "false"
        reloader.stakater.com/auto: "true"
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.6@sha256:c3415e8660af553f5e18f5d90db050614c02493c0ac6260ac59442f6d9b12048
          args:
            - --provider=oidc
            - --oidc-issuer-url=https://auth.${PUBLIC_DOMAIN}
            - --upstream=http://forno-wpp:8080
            - --http-address=0.0.0.0:4180
            - --redirect-url=https://forno-wpp.${SECRET_DOMAIN}/oauth2/callback
            - --cookie-domain=.${SECRET_DOMAIN}
            - --cookie-name=_oauth2_proxy_forno
            - --cookie-secure=true
            - --email-domain=*
            - --skip-provider-button=true
            - --code-challenge-method=S256
          envFrom:
            - secretRef:
                name: forno-wpp-oauth2-proxy
          ports:
            - containerPort: 4180
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 5m
              memory: 30Mi
            limits:
              memory: 100Mi
---
apiVersion: v1
kind: Service
metadata:
  name: forno-wpp-oauth2-proxy
  namespace: forno-wpp
spec:
  selector:
    app.kubernetes.io/name: forno-wpp-oauth2-proxy
  ports:
    - name: http
      port: 4180
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: forno-wpp
  namespace: forno-wpp
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Forno
    gethomepage.dev/group: Messaging
    gethomepage.dev/icon: whatsapp.png
spec:
  parentRefs:
    - name: internal
      namespace: networking
      sectionName: https
  hostnames:
    - "forno-wpp.${SECRET_DOMAIN}"
  rules:
    - backendRefs:
        - name: forno-wpp-oauth2-proxy
          port: 4180
