---
apiVersion: http.keda.sh/v1beta1
kind: InterceptorRoute
metadata:
  name: home-assistant-v2-code-server
  namespace: home
spec:
  target:
    service: home-assistant-v2-code-server
    port: 8080
  rules:
    - hosts:
        - "hass-v2-vscode.${SECRET_DOMAIN}"
  scalingMetric:
    concurrency:
      targetValue: 10
  coldStart:
    maxPendingRequests: 100
    overflow: Reject
  timeouts:
    readiness: 2m
    request: 3m
    responseHeader: 2m
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: home-assistant-v2-code-server
  namespace: home
spec:
  scaleTargetRef:
    name: home-assistant-v2-code-server
  pollingInterval: 5
  cooldownPeriod: 600
  minReplicaCount: 0
  maxReplicaCount: 1
  advanced:
    restoreToOriginalReplicaCount: true
  triggers:
    - type: external-push
      metadata:
        scalerAddress: keda-add-ons-http-external-scaler.keda.svc.cluster.local:9090
        interceptorRoute: home-assistant-v2-code-server
