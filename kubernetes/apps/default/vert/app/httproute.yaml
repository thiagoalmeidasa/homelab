---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vert
  namespace: default
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Convert
    gethomepage.dev/group: Productivity
    gethomepage.dev/description: Convert files into different formats
spec:
  parentRefs:
    - name: external
      namespace: networking
      sectionName: https
  hostnames:
    - "convert.${PUBLIC_DOMAIN}"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /oauth2
      backendRefs:
        - group: ""
          kind: Service
          name: oauth2-proxy
          namespace: auth
          port: 4180
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExternalAuth
          externalAuth:
            protocol: HTTP
            backendRef:
              group: ""
              kind: Service
              name: oauth2-proxy
              namespace: auth
              port: 4180
            http:
              allowedHeaders:
                - accept
                - authorization
                - cookie
                - x-forwarded-host
                - x-forwarded-proto
                - x-forwarded-uri
              allowedResponseHeaders:
                - x-auth-request-email
                - x-auth-request-groups
                - x-auth-request-preferred-username
                - x-auth-request-user
      backendRefs:
        - group: ""
          kind: Service
          name: vert-app
          port: 80
