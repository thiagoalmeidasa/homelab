---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app vert
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: 1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback
  driftDetection:
    mode: enabled

  values:
    controllers:
      vert:
        replicas: null
        strategy: Recreate
        pod:
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
        containers:
          app:
            image:
              repository: ghcr.io/vert-sh/vert
              tag: main@sha256:df3a22efeccf0e37adc3b4d01ecc1bd4ad2bc00ec44dc4672f74b23ba8f3ede9
            env:
              TZ: ${TIMEZONE}
              PUB_DISABLE_ALL_EXTERNAL_REQUESTS: true
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/liveness
                    port: &port 80
                  initialDelaySeconds: 15
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probes
            resources:
              requests:
                cpu: 25m
                memory: 256Mi
              limits:
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
      oauth2-proxy:
        annotations:
          reloader.stakater.com/auto: "true"
        replicas: null
        strategy: Recreate
        pod:
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
        containers:
          app:
            image:
              repository: quay.io/oauth2-proxy/oauth2-proxy
              tag: v7.15.6@sha256:c3415e8660af553f5e18f5d90db050614c02493c0ac6260ac59442f6d9b12048
            args:
              - --provider=oidc
              - --oidc-issuer-url=https://auth.${PUBLIC_DOMAIN}
              - --upstream=http://vert-app:80
              - --http-address=0.0.0.0:4180
              - --redirect-url=https://convert.${PUBLIC_DOMAIN}/oauth2/callback
              - --cookie-domain=.${PUBLIC_DOMAIN}
              - --cookie-name=_oauth2_proxy_vert
              - --cookie-secure=true
              - --email-domain=*
              - --skip-provider-button=true
              - --code-challenge-method=S256
            env:
              TZ: ${TIMEZONE}
            envFrom:
              - secretRef:
                  name: convert-oauth2-proxy
            ports:
              - containerPort: &oauth2-port 4180
                name: http
            probes:
              startup:
                enabled: true
                custom: false
              liveness: &oauth2-probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *oauth2-port
                  initialDelaySeconds: 15
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *oauth2-probes
            resources:
              requests:
                cpu: 5m
                memory: 30Mi
              limits:
                memory: 100Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]

    service:
      app:
        controller: *app
        ports:
          http:
            port: *port
      oauth2-proxy:
        controller: oauth2-proxy
        ports:
          http:
            port: *oauth2-port

    persistence:
      cache:
        type: emptyDir
        sizeLimit: 5Gi
        globalMounts:
          - path: "/var/cache/nginx"
      run:
        type: emptyDir
        sizeLimit: 1Gi
        globalMounts:
          - path: "/var/run"
