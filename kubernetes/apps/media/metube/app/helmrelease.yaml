---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name metube
  namespace: media
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    fullnameOverride: *name
    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      hostname: *name
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
    controllers:
      metube:
        annotations:
          setGateway: "false"
        containers:
          metube:
            image:
              repository: ghcr.io/alexta69/metube
              tag: 2026.10.27@sha256:845a67373a9f9e62b88e5f9067867202200d63db3615a051acbd77b09e86b9ce
            env:
              TZ: "${TIMEZONE}"
              DOWNLOAD_DIR: "/downloads"
              STATE_DIR: "/config"
              TEMP_DIR: "/tmp"
              OUTPUT_TEMPLATE: "%(title)s_-_[%(id)s].%(ext)s"
              YTDL_OPTIONS: |
                {
                  "restrictfilenames": true,
                  "verbose": true,
                  "clean_infojson": true
                }
              YTDL_OPTIONS_PRESETS: |
                {
                  "Web compatible (H.264 + AAC, MP4)": {
                    "format": "bv[dynamic_range=?SDR]+ba/b[dynamic_range=?SDR]",
                    "merge_output_format": "mkv",
                    "postprocessor_args": {
                      "videoconvertor+ffmpeg_o": [
                        "-c:v", "libx264", "-crf", "18", "-preset", "medium",
                        "-pix_fmt", "yuv420p", "-profile:v", "high",
                        "-vf", "scale=trunc(iw/2)*2:trunc(ih/2)*2",
                        "-c:a", "aac", "-b:a", "192k", "-ar", "48000", "-ac", "2",
                        "-threads", "2", "-movflags", "+faststart"
                      ]
                    },
                    "writethumbnail": true,
                    "postprocessors": [
                      {"key": "FFmpegVideoRemuxer", "preferedformat": "mkv"},
                      {"key": "FFmpegVideoConvertor", "preferedformat": "mp4"},
                      {"key": "FFmpegThumbnailsConvertor", "format": "jpg", "when": "before_dl"},
                      {"key": "FFmpegMetadata", "add_metadata": true, "add_chapters": true},
                      {"key": "EmbedThumbnail"}
                    ]
                  },
                  "Best quality for editing (ProRes 422 HQ + PCM, MOV)": {
                    "format": "bv*+ba/b",
                    "merge_output_format": "mkv",
                    "postprocessor_args": {
                      "videoconvertor+ffmpeg_o": [
                        "-c:v", "prores_ks", "-profile:v", "3", "-pix_fmt", "yuv422p10le",
                        "-c:a", "pcm_s24le", "-threads", "2"
                      ]
                    },
                    "writethumbnail": true,
                    "postprocessors": [
                      {"key": "FFmpegVideoRemuxer", "preferedformat": "mkv"},
                      {"key": "FFmpegVideoConvertor", "preferedformat": "mov"},
                      {"key": "FFmpegThumbnailsConvertor", "format": "jpg", "when": "before_dl"},
                      {"key": "FFmpegMetadata", "add_metadata": true, "add_chapters": true},
                      {"key": "EmbedThumbnail"}
                    ]
                  }
                }
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 10m
                memory: 100Mi
              limits:
                memory: 2Gi
    service:
      metube:
        controller: *name
        ports:
          http:
            port: 8081
    persistence:
      config:
        enabled: true
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        retain: true
        size: 1Gi
        storageClass: longhorn
      tmp:
        enabled: true
        type: emptyDir
      media:
        enabled: true
        type: nfs
        server: "${NFS_SERVER}"
        path: "${NFS_KUBERNETES}/ytdlp"
        globalMounts:
          - path: /downloads
