---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: metube
  namespace: media
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: MeTube
    gethomepage.dev/group: Media
    gethomepage.dev/icon: youtube.png
spec:
  parentRefs:
    - name: internal
      namespace: networking
      sectionName: https
  hostnames:
    - "metube.${SECRET_DOMAIN}"
  rules:
    - backendRefs:
        - name: metube-oauth2-proxy
          port: 4180
