---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/barmancloud.cnpg.io/objectstore_v1.json
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: farinhada-wpp-object-store
  namespace: farinhada-wpp
spec:
  configuration:
    destinationPath: s3://cnpg-backups/farinhada-wpp
    endpointURL: http://versitygw.storage.svc.cluster.local:7070
    s3Credentials:
      accessKeyId:
        name: farinhada-wpp-s3-secret
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: farinhada-wpp-s3-secret
        key: SECRET_ACCESS_KEY
    wal:
      compression: bzip2
    data:
      compression: bzip2
  retentionPolicy: "30d"
