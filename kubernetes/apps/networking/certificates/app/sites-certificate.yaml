---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: "sites-${SECRET_DOMAIN/./-}-production"
  namespace: networking
spec:
  secretName: "sites-${SECRET_DOMAIN/./-}-production-tls"
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  commonName: "sites.${PUBLIC_DOMAIN}"
  dnsNames:
    - "sites.${PUBLIC_DOMAIN}"
    - "*.sites.${PUBLIC_DOMAIN}"
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: "sites-${SECRET_DOMAIN/./-}-staging"
  namespace: networking
spec:
  secretName: "sites-${SECRET_DOMAIN/./-}-staging-tls"
  issuerRef:
    name: letsencrypt-staging
    kind: ClusterIssuer
  commonName: "sites.${PUBLIC_DOMAIN}"
  dnsNames:
    - "sites.${PUBLIC_DOMAIN}"
    - "*.sites.${PUBLIC_DOMAIN}"
