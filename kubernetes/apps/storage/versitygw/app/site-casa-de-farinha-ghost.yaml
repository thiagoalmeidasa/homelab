---
# Serves the Ghost S3 bucket (media and files) publicly. The bucket must
# exist with website config and public-read ACL — see docs/WEBSITE_HOSTING.md
# and kubernetes/apps/casa-de-farinha/site/README.md.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: versity-site-casa-de-farinha-ghost
  namespace: storage
spec:
  parentRefs:
    - name: external
      namespace: networking
      sectionName: https
  hostnames:
    - "casa-de-farinha-ghost.${PUBLIC_DOMAIN}"
  rules:
    - filters:
        - type: URLRewrite
          urlRewrite:
            hostname: "casa-de-farinha-ghost.sites.${PUBLIC_DOMAIN}"
      backendRefs:
        - name: versitygw
          port: 8090
