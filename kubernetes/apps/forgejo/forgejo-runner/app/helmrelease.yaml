---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app forgejo-runner
spec:
  interval: 30m
  timeout: 10m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback
  chartRef:
    kind: OCIRepository
    name: *app
    namespace: flux-system
  values:
    forgejo:
      url: http://forgejo-http.forgejo.svc.cluster.local:3000
      existingSecret: forgejo-runner-secret
    image:
      repository: data.forgejo.org/forgejo/runner
      tag: 13.2.1
      digest: sha256:ca3d5eea46004789a175d1369eec6829d3ea9bfbe2011a06625b4bdaa55f7552
    podLabels:
      app.kubernetes.io/component: forgejo-runner
    runnerConfig: |
      cache:
        enabled: false
      container:
        docker_host: "-"
        workdir_parent: shared/workdir
      host:
        workdir_parent: /data/act
      kubernetes:
        namespace: forgejo
        poll_timeout: 10m
      log:
        level: info
      plugins:
        k8s:
          address: "unix:///plugin/forgejo-runner-k8s.sock"
          options:
            namespace: forgejo
            poll_timeout: 10m
            resources: |
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi
      runner:
        capacity: 2
        labels:
          - ubuntu-latest:k8s:///config/podspec-default.yaml
          - ubuntu-24.04:k8s:///config/podspec-default.yaml
          - default:k8s:///config/podspec-default.yaml
          - ubuntu-24.04-amd64:k8s:///config/podspec-default.yaml
          - ubuntu-24.04-arm64:k8s:///config/podspec-arm64.yaml
        timeout: 3h
        shutdown_timeout: 3m
    podSpecs:
      podspec-default.yaml: |-
        nodeSelector:
          kubernetes.io/arch: amd64
        containers:
          - env:
              - name: DEBIAN_FRONTEND
                value: noninteractive
              - name: BUILDKIT_HOST
                value: tcp://buildkit-amd64.forgejo.svc:1234
            image: ghcr.io/bjw-s-labs/forgejo-runner:ubuntu-24.04@sha256:8b7a25c7b3235c27e97df1cbb8411c1d12d2676e739265b5fbb66bb55f72dbf6
            imagePullPolicy: IfNotPresent
            name: main
            resources:
              limits:
                memory: 2Gi
              requests:
                cpu: 100m
                memory: 256Mi
            volumeMounts:
              - name: buildkit-client
                mountPath: /certs/buildkit
                readOnly: true
        volumes:
          - name: buildkit-client
            secret:
              secretName: buildkit-client-secret
              defaultMode: 0400
        restartPolicy: Never
      podspec-arm64.yaml: |-
        nodeSelector:
          kubernetes.io/arch: arm64
        containers:
          - env:
              - name: DEBIAN_FRONTEND
                value: noninteractive
              - name: BUILDKIT_HOST
                value: tcp://buildkit-arm64.forgejo.svc:1234
            image: ghcr.io/bjw-s-labs/forgejo-runner:ubuntu-24.04@sha256:8b7a25c7b3235c27e97df1cbb8411c1d12d2676e739265b5fbb66bb55f72dbf6
            imagePullPolicy: IfNotPresent
            name: main
            resources:
              limits:
                memory: 2Gi
              requests:
                cpu: 100m
                memory: 256Mi
            volumeMounts:
              - name: buildkit-client
                mountPath: /certs/buildkit
                readOnly: true
        volumes:
          - name: buildkit-client
            secret:
              secretName: buildkit-client-secret
              defaultMode: 0400
        restartPolicy: Never
