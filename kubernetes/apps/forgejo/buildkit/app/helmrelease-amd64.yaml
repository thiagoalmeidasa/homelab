---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app buildkit-amd64
  namespace: forgejo
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback
  values:
    controllers:
      buildkit:
        type: statefulset
        annotations:
          # Restart automatically when the mounted TLS secret rotates; interrupted
          # builds must be retried.
          reloader.stakater.com/auto: "true"
        pod:
          nodeSelector:
            kubernetes.io/arch: amd64
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
        containers:
          buildkitd:
            image:
              repository: moby/buildkit
              tag: v0.34.1-rootless@sha256:f68752a5a94acfcdad2d07867b7075601a421638e17fc5f28efc1c814d0c4f89
            env:
              TZ: ${TIMEZONE}
            args:
              - --addr
              - unix:///run/user/1000/buildkit/buildkitd.sock
              - --addr
              - tcp://0.0.0.0:1234
              - --tlscacert
              - /certs/ca.crt
              - --tlscert
              - /certs/tls.crt
              - --tlskey
              - /certs/tls.key
              # Kubernetes has no equivalent of Docker's systempaths=unconfined;
              # see https://github.com/moby/buildkit/blob/master/docs/rootless.md
              - --oci-worker-no-process-sandbox
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  exec:
                    command: [buildctl, debug, workers]
                  initialDelaySeconds: 5
                  periodSeconds: 30
              readiness:
                <<: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: [buildctl, debug, workers]
                  initialDelaySeconds: 5
                  periodSeconds: 5
                  failureThreshold: 60
            resources:
              requests:
                cpu: 500m
                memory: 1Gi
              limits:
                memory: 4Gi
            securityContext:
              # Rootless mode requirements; not a strong isolation boundary.
              # See https://github.com/moby/buildkit/blob/master/docs/rootless.md
              runAsUser: 1000
              runAsGroup: 1000
              seccompProfile:
                type: Unconfined
              appArmorProfile:
                type: Unconfined

    service:
      buildkit:
        controller: buildkit
        type: ClusterIP
        ports:
          buildkit:
            port: 1234

    persistence:
      certs:
        type: secret
        name: buildkit-amd64-tls-secret
        globalMounts:
          - path: /certs
            readOnly: true
      data:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        retain: true
        size: 20Gi
        storageClass: longhorn-buildkit
        globalMounts:
          - path: /home/user/.local/share/buildkit
        # Intentionally no recurring-job backup labels: build cache is
        # disposable and excluded from Longhorn backups.
