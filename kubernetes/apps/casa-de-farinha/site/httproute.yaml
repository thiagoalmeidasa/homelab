---
# Internal-only route: admin panel and site access from the LAN.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: site
  namespace: casa-de-farinha
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Casa de Farinha
    gethomepage.dev/group: Websites
    gethomepage.dev/icon: ghost.png
spec:
  parentRefs:
    - name: internal
      namespace: networking
      sectionName: https
  hostnames:
    - "casa-de-farinha.${SECRET_DOMAIN}"
  rules:
    - backendRefs:
        - name: site
          port: http
---
# Public route: site is public, but the admin path (/ghost/) is blackholed
# to error-pages. Admin is only reachable via the SECRET_DOMAIN route above.
# Cross-namespace backend is allowed by the ReferenceGrant in
# networking/error-pages/app/referencegrant-site.yaml.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: site-public
  namespace: casa-de-farinha
spec:
  parentRefs:
    - name: external
      namespace: networking
      sectionName: https
    - name: internal
      namespace: networking
      sectionName: https
  hostnames:
    - "casa-de-farinha.${PUBLIC_DOMAIN}"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /ghost/
      backendRefs:
        - name: error-pages
          namespace: networking
          port: 8080
    - backendRefs:
        - name: site
          port: http
