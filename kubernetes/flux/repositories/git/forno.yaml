---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: forno
  namespace: flux-system
spec:
  interval: 30m
  url: https://git.home399.thiagoalmeida.xyz/casa-de-farinha/forno
  # Auto-deploys new 0.x minor/patch tags (highest match wins). A new MAJOR
  # (1.0.0) falls outside the range and is held back until the range is
  # bumped manually here, e.g. ">=1.0.0 <2.0.0".
  ref:
    semver: ">=v0.0.1 <v1.0.0"
  secretRef:
    name: forno-git
