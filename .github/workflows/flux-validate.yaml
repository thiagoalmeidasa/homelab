---
name: "Flux Validate"

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
    paths: ["kubernetes/**"]

jobs:
  flux-validate:
    name: Flux Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Flux CLI
        uses: fluxcd/flux2/action@889be9d6cc8afa8ed639e1e1ba4ab678e3b38d8c # v2.9.4

      - name: Setup Flux Schema CLI
        uses: fluxcd/flux-schema/actions/setup@3c02b4fbed04797116e127ac4ed4fd5b654c2dc4 # v0.12.1

      - name: Validate manifests
        uses: fluxcd/flux-schema/actions/validate@3c02b4fbed04797116e127ac4ed4fd5b654c2dc4 # v0.12.1
        with:
          path: kubernetes
          config: .fluxschema.yml
