---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "Flux Diff"

on:
  pull_request:
    branches: ["main"]
    paths: ["kubernetes/**", ".github/workflows/flux-diff.yaml"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  flux-diff:
    name: Flux Diff
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    strategy:
      matrix:
        paths: ["kubernetes"]
        resources: ["helmrelease", "kustomization"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pull

      - name: Checkout Default Branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: "${{ github.event.repository.default_branch }}"
          path: default

      - name: Setup flate CLI
        uses: home-operations/flate/action@631b76b69c4e58c6f4d1cb01e23616fa61aebafa # v0.6.5
        with:
          cache: true
          base: ""

      - name: Diff Resources
        env:
          RESOURCE: ${{ matrix.resources }}
          CLUSTER_PATH: ${{ matrix.paths }}
        run: |
          flate diff "$RESOURCE" \
            --path "pull/$CLUSTER_PATH/flux" \
            --path-orig "default/$CLUSTER_PATH/flux" \
            --output diff --no-progress --allow-missing-secrets \
            --strip-attr helm.sh/chart \
            --strip-attr checksum/config \
            --strip-attr app.kubernetes.io/version \
            --strip-attr chart > diff.patch

      - name: Generate Diff
        id: diff
        run: |
          python3 - <<'PY'
          import os
          import uuid
          from pathlib import Path

          content = Path("diff.patch").read_bytes()
          if not content:
              raise SystemExit(0)
          notice = "\n... Diff truncated to 10,000 bytes.\n"
          if len(content) > 10000:
              content = content[:10000 - len(notice.encode())]
              diff = content.decode("utf-8", errors="ignore") + notice
          else:
              diff = content.decode("utf-8")
          print(diff, end="")
          delimiter = uuid.uuid4().hex
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"diff<<{delimiter}\n{diff}\n{delimiter}\n")
          PY

      - if: ${{ steps.diff.outputs.diff != '' }}
        name: Add comment
        uses: mshick/add-pr-comment@ec328af66588ab8f77cdeb2c264f14aba45bbf59 # v3.12
        with:
          message-id: "${{ github.event.pull_request.number }}/${{ matrix.paths }}/${{ matrix.resources }}"
          message-failure: Diff was not successful
          message: |
            ```diff
            ${{ steps.diff.outputs.diff }}
            ```
